'use strict';

const crmWeb = (() => {
 const deployed=window.FIVEROX_CRM_CONFIG?.webAppUrl??'';
 const validUrl=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(deployed);
 let unmount;

 function fromEditor(source,frame){
  for(let depth=0;source&&depth<6;depth+=1){
   if(source===frame.contentWindow)return true;
   const parent=source.parent;
   if(parent===source)return false;
   source=parent;
  }
  return false;
 }

 function mount(root){
  unmount?.();
  const button=root.querySelector('#crmOpen');
  const directLink=root.querySelector('#crmDirectLink');
  const status=root.querySelector('#crmStatus');
  const frame=root.querySelector('#crmFrame');
  if(!validUrl){
   status.textContent='Адрес веб-редактора недоступен. Карточки можно открыть в Google Таблице ниже.';
   return;
  }

  directLink.href=deployed;
  directLink.hidden=false;
  button.disabled=false;
  let timer,channel,opened=false;
  const controller=new AbortController();
  unmount=()=>{
   clearTimeout(timer);
   controller.abort();
   unmount=undefined;
  };
  window.addEventListener('message',event=>{
   if(!root.isConnected||!channel||event.data?.type!=='fiverox-crm:ready'||event.data.channel!==channel)return;
   if(!/^https:\/\/(?:script\.google\.com|[a-z0-9-]+-script\.googleusercontent\.com)$/.test(event.origin))return;
   if(!fromEditor(event.source,frame))return;
   event.source.postMessage({type:'fiverox-crm:open',channel},event.origin);
   clearTimeout(timer);
   channel='';
   frame.hidden=false;
   button.disabled=false;
   button.setAttribute('aria-expanded','true');
   opened=event.data.accessGranted!==false;
   button.textContent=opened?'Перейти к редактору':'Повторить открытие';
   status.textContent=opened?'Редактор открыт.':'Для входа используйте Google-аккаунт с правами редактора таблицы.';
  },{signal:controller.signal});

  button.addEventListener('click',()=>{
   if(opened){
    frame.scrollIntoView({block:'nearest'});
    return;
   }
   clearTimeout(timer);
   frame.hidden=true;
   button.setAttribute('aria-expanded','false');
   button.disabled=true;
   channel=Array.from(crypto.getRandomValues(new Uint8Array(16)),byte=>byte.toString(16).padStart(2,'0')).join('');
   status.textContent='Открываю редактор…';
   frame.src=deployed+'?channel='+channel;
   timer=setTimeout(()=>{
    if(!root.isConnected)return;
    button.disabled=false;
    status.textContent='Редактор внутри страницы не загрузился. Нажмите «CRM в новой вкладке».';
   },12000);
  },{signal:controller.signal});
 }

 return {mount,unmount:()=>unmount?.()};
})();

function compareAuto(years){
 const [a,b]=years;
 if(!Number.isFinite(a)||!Number.isFinite(b)||a===0)return null;
 return {delta:b-a,rate:100*(b-a)/a,total:a+b};
}

const leadFilterIds=['query','geo','city','profile','source','price','sort'];
let leadOverviewOpen=false;
let leadIndex;
const labels={confirmed:'Подтверждённые',all:'Все точки','Оклейка':'Оклейка','Тонировка':'Тонировка','Оклейка + тонировка':'Обе услуги','Требует проверки':'Кандидаты'};
function select(id,label,values){
 return '<label>'+esc(label)+'<select id="'+id+'">'+values.map(([k,l])=>'<option value="'+esc(k)+'"'+(state[id]===k?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select></label>';
}
const phoneDigits=value=>value.replace(/\D/g,'').replace(/^8(?=\d{10}$)/,'7');
function selected(){
 const q=norm(state.query.trim());
 const phoneQuery=/^[+\d\s().-]+$/.test(q)?phoneDigits(q):'';
 leadIndex??=leads.map(lead=>({
  lead,
  price:Math.min(...lead.prices.filter(p=>p.quality==='Опубликована сумма'&&Number.isFinite(p.amount)).map(p=>p.amount)),
  text:norm([lead.name,lead.city,lead.address,lead.id,lead.yId,lead.profile,...lead.phones,...lead.attributes].join(' ')),
  phones:lead.phones.map(phoneDigits),
 }));
 const rows=leadIndex.filter(({lead:l,price,text,phones})=>
  (!state.geo||l.geo===state.geo)&&(!state.city||l.city===state.city)
  &&(state.profile==='all'||state.profile==='confirmed'&&l.status==='Подтверждено'||l.profile===state.profile)
  &&(!state.source||Object.hasOwn(l.links,state.source)||state.source==='both'&&l.source==='2ГИС + Яндекс')
  &&(!state.price||(state.price==='yes'?Number.isFinite(price):state.price==='conditional'?l.priceStatus==='Только условные позиции / материал':state.price==='none'?l.prices.length===0:!Number.isFinite(price)))
  &&(!q||text.includes(q)||phoneQuery&&phones.some(phone=>phone.includes(phoneQuery))));
 if(state.sort==='name')return rows.sort((a,b)=>a.lead.name.localeCompare(b.lead.name,'ru'));
 if(state.sort.startsWith('price'))return rows.sort(({price:x},{price:y})=>{
  if(!Number.isFinite(x)||!Number.isFinite(y))return Number.isFinite(y)-Number.isFinite(x);
  return state.sort==='price-up'?x-y:y-x;
 });
 return rows;
}

function openLead(id){
 const l=leads.find(x=>x.id===id);
 if(!l)return;
 const sources=Object.entries(l.links).map(([name,url])=>link(url,name+' ↗')).join(' · ');
 const proof=l.proof.length?'<ul>'+l.proof.map(p=>'<li><strong>'+esc(p.service)+'</strong> · '+esc(p.text)+' · '+link(p.url,p.kind+' ↗')+'</li>').join('')+'</ul>':'<p class="note">Услуги нужно уточнить у компании.</p>';
 const contacts=[...l.phones.map(p=>'<a href="tel:'+esc(p)+'">'+esc(p)+'</a>'),...l.emails.map(p=>'<a href="mailto:'+esc(p)+'">'+esc(p)+'</a>'),...l.sites.map(p=>link(p,p)),...l.socials.map(p=>link(p,p))].filter(Boolean);
 const prices=l.prices.length?'<div class="lead-price-list">'+l.prices.map(p=>{
  const amount=p.amount==null?'н/д':(p.type==='От'?'от ':'')+money.format(p.amount);
  return '<article class="lead-price"><div class="lead-price-heading"><h4>'+esc(p.service)+'</h4><strong>'+esc(amount)+'</strong></div>'
   +(p.description?'<p>'+esc(p.description)+'</p>':'')+'<p class="lead-price-meta">'+esc(p.type)+(p.updated?' · '+esc(p.updated):'')+'</p><p class="lead-price-links">'+link(p.url,p.source+' ↗')+(p.alternativeUrl?link(p.alternativeUrl,'Дубль источника ↗'):'')+'</p></article>';
 }).join('')+'</div>':'<p class="note">Позиции по плёнкам в просмотренных прайсах не найдены.</p>';
 document.querySelector('#dialogContent').innerHTML='<div class="lead-dialog-header"><div class="eyebrow">Карточка '+esc(l.id)+'</div><h2 id="dialogTitle">'+esc(l.name)+'</h2><p>'+esc(l.city)+' · '+esc(l.address)+'</p><p class="pills">'+profilePill(l)+'</p></div>'
 +'<p class="lead-crm-link">'+link(crmCardsUrl,'Перейти к карточкам CRM ↗')+' <span>Вход через Google · поиск по названию или ID</span></p>'
 +'<section class="dialog-section"><h3>Контакты</h3>'+(contacts.length?'<ul class="lead-contact-list">'+contacts.map(contact=>'<li>'+contact+'</li>').join('')+'</ul>':'<p class="note">Контакты в просмотренных источниках не указаны.</p>')+(l.hours?'<p>'+esc(l.hours)+'</p>':'')+'<p>'+sources+'</p>'
 +l.ratings.filter(x=>x.rating!=null).map(x=>'<p>'+esc(x.source)+' · '+fmt(x.rating)+' / 5'+(x.reviews!=null?' · отзывов '+fmt(x.reviews):'')+'</p>').join('')+'</section>'
 +'<section class="dialog-section"><h3>Прайс</h3>'+prices+(l.prices.length?'<p class="note">Сортировка учитывает опубликованные суммы. Дата в позиции — из прайса.</p>':'')+'</section>'
 +'<div class="dialog-section">'+disclosure('Подтверждение услуг',proof+(l.review?'<p class="notice">'+esc(l.review)+'</p>':'')+(l.match?'<p>'+esc(l.match)+'</p>':''))+'</div>';
 dialog.showModal();
 dialog.scrollTop=0;
}
function modelView(){
 const input=(id,label,min,max,step,value)=>'<label>'+esc(label)+'<input id="'+id+'" type="number" value="'+value+'" min="'+min+'" max="'+max+'" step="'+step+'"></label>';
 const basketInputs=sale.basket.map((r,i)=>'<div class="basket-row"><strong>'+esc(r.label)+'</strong>'+input('quantity'+i,'Рулонов',0,1000,1,r.quantity)+input('price'+i,'Цена за рулон, ₽',0,10000000,0.01,r.price)+'<span class="basket-result" id="basketCost'+i+'"></span></div>').join('');
 main.innerHTML=hero('Модель продаж · FIVEROX','От подключений к обороту','Подставьте количество точек, состав корзины и маржу. Введённые числа сохраняются в этом браузере.')
  +'<section class="metrics model-metrics" id="modelMetrics" aria-label="Результаты за месяц" aria-live="polite"></section>'
  +'<div class="split model-layout"><section class="panel"><h2 class="subhead">Параметры</h2><div class="inputs">'
  +input('outlets','Подключённые точки',0,10000,1,sale.outlets)+input('target','Цель по точкам',1,10000,1,sale.target)+input('margin','Маржа, %',0,100,0.1,sale.margin)
  +'</div><button class="button" id="example" type="button">Пример на 10 точек</button><p id="goalLabel" class="note"></p><progress id="goal" class="progress" aria-label="Прогресс подключения" value="0" max="100"></progress></section>'
  +'<section class="panel"><h2 class="subhead">Корзина одной точки</h2><div class="basket-grid">'+basketInputs+'</div><div class="basket-footer"><p id="basketTotal" class="note"></p><button class="button" id="resetBasket" type="button">Сбросить корзину</button></div></section></div>'
  +'<section id="modelChart" class="dashboard-block" aria-label="Графики модели продаж"></section><p class="note notice">Сумма по марже рассчитывается до прочих расходов.</p>';
 const fields=new Map([...main.querySelectorAll('[id]')].map(el=>[el.id,el]));
 const field=id=>fields.get(id);
 const inputs=[...main.querySelectorAll('input[type=number]')];
 function number(id,previous){
  const {valueAsNumber:value,min,max,step}=field(id);
  const clamped=Math.max(Number(min),Math.min(Number(max),Number.isFinite(value)?value:previous));
  const factor=1/Number(step);
  return step==='1'?Math.trunc(clamped):Math.round(clamped*factor)/factor;
 }
 function update(){
  sale.outlets=number('outlets',sale.outlets);
  sale.target=number('target',sale.target);
  sale.margin=number('margin',sale.margin);
  sale.basket.forEach((r,i)=>{
    r.quantity=number('quantity'+i,r.quantity);
    r.price=number('price'+i,r.price);
    field('basketCost'+i).textContent=money.format(r.quantity*r.price);
  });
  const {outlets:points,target,margin,basket}=sale;
  const rolls=basket.reduce((sum,r)=>sum+r.quantity,0);
  const unitRevenue=basket.reduce((sum,r)=>sum+r.quantity*r.price,0);
  const percent=points/target*100;
  field('goal').value=Math.min(percent,100);
  field('goalLabel').textContent='Подключено '+fmt(points)+' из '+fmt(target)+' · '+nf.format(percent)+'% цели';
  field('basketTotal').textContent=countLabel(rolls,'рулон','рулона','рулонов')+' · '+money.format(unitRevenue)+' на точку в месяц';
  field('modelMetrics').innerHTML=metric('Оборот / месяц',money.format(points*unitRevenue),'Подключённые точки × корзина')+metric('По марже / месяц',money.format(points*unitRevenue*margin/100),'При марже '+nf.format(margin)+'%')+metric('Рулонов / месяц',nf.format(points*rolls),countLabel(rolls,'рулон','рулона','рулонов')+' на точку');
  field('modelChart').innerHTML=modelCharts(target,margin,basket,unitRevenue);
 }
 function updateAndSave(){
  update();
  try {
   localStorage.setItem(saleStorageKey,JSON.stringify(sale));
  } catch {
   // Browser storage restrictions do not prevent recalculation.
  }
 }
 function showCommittedValue(el){
  const match=el.id.match(/^(quantity|price)(\d+)$/);
  el.value=match?sale.basket[Number(match[2])][match[1]]:sale[el.id];
 }
 for(const el of inputs){
  el.addEventListener('input',updateAndSave);
  el.addEventListener('blur',()=>showCommittedValue(el));
 }
 field('example').addEventListener('click',()=>{field('outlets').value=10;field('target').value=10;field('margin').value=20;updateAndSave();});
 field('resetBasket').addEventListener('click',()=>{
  basketDefaults.forEach((r,i)=>{field('quantity'+i).value=r.quantity;field('price'+i).value=r.price;});
  updateAndSave();
 });
 update();
 inputs.forEach(showCommittedValue);
}

  ['Очередь контактов','Просроченные контакты, задачи на сегодня и будущие встречи.',crmBookUrl+'#gid=704101002','Открыть очередь ↗'],
  ['История контактов','Звонки, сообщения, встречи и результаты общения.',crmBookUrl+'#gid=704101003','Открыть историю ↗'],
 ];
 main.innerHTML=hero('FIVEROX · рабочий кабинет','CRM','Рабочая база Чеченской Республики.')
  +`<section id="crmInline" aria-label="Редактор CRM">
   <div class="crm-entry"><div><h2>Воронка и карточки</h2><p>Доступ через Google для владельца и редакторов закрытой таблицы.</p><p>Если в браузере открыто несколько Google-аккаунтов, откройте CRM в приватном окне и войдите под одним аккаунтом редактора.</p></div>
    <div class="crm-links"><a id="crmDirectLink" class="button" target="_blank" rel="noopener noreferrer" hidden>CRM в новой вкладке ↗</a><button id="crmOpen" type="button" aria-controls="crmFrame" aria-expanded="false" disabled>Открыть редактор</button></div>
    <p id="crmStatus" class="crm-status" role="status"></p>
   </div>
   <iframe id="crmFrame" class="crm-frame" title="Редактор карточек FIVEROX CRM" referrerpolicy="no-referrer" hidden></iframe>
  </section>`
  +'<section class="crm-entry" aria-labelledby="crm-entry-title"><div><h2 id="crm-entry-title">Обзор в Google Таблице</h2><p>Сводка по этапам и сроки следующих контактов.</p></div><div class="crm-links">'+link(crmBookUrl,'Открыть Google Таблицу ↗')+'</div></section>'
  +'<section class="chart-grid crm-sections" aria-label="Разделы CRM">'+sections.map(([title,description,url,label])=>
   '<article class="chart"><h2>'+esc(title)+'</h2><p class="chart-sub">'+esc(description)+'</p><div class="crm-section-link">'+link(url,label)+'</div></article>'
  ).join('')+'</section>';
 crmWeb.mount(document.querySelector('#crmInline'));
}
const views={market:marketView,leads:leadsView,model:modelView,crm:crmView};
function route(){
 const key=location.hash.slice(1);
 if(key!=='crm')crmWeb.unmount();
 const tab=Object.hasOwn(views,key)?key:'market';
 main.dataset.view=tab;
 for(const a of document.querySelectorAll('.nav a'))if(a.hash==='#'+tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
 views[tab]();
}
main.addEventListener('click',e=>{
 const jump=e.target.closest('button[data-jump]');
 if(jump){
  const section=document.getElementById(jump.dataset.jump);
  section.focus({preventScroll:true});
  section.scrollIntoView({block:'start'});
  return;
 }
 const lead=e.target.closest('button[data-lead]');
 if(lead){openLead(lead.dataset.lead);return;}
 const filter=e.target.closest('button[data-chart-filter]');
 if(!filter)return;
 resetLeadFilters({[filter.dataset.chartFilter]:filter.dataset.choice});
 const panel=document.querySelector('#leadFilters');
 panel.scrollIntoView({block:'start'});
 document.querySelector('#'+filter.dataset.chartFilter).focus({preventScroll:true});
});
document.querySelector('.skip').addEventListener('click',event=>{
 event.preventDefault();
 main.focus({preventScroll:true});
 main.scrollIntoView({block:'start'});
});
window.addEventListener('hashchange',()=>{route();window.scrollTo({top:0});});
route();
