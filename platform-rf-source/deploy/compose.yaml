services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_ENGINE: pg
      HOST: 0.0.0.0
      PORT: 8080
      PUBLIC_DIR: /app/site
    expose:
      - "8080"
    volumes:
      - ${POSTGRES_CA_PATH:?Set the provider CA path}:/run/postgres-ca.crt:ro
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  web:
    image: caddy:2-alpine
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?Set a controlled CRM domain in deploy/.env}
      TLS_EMAIL: ${TLS_EMAIL:?Set certificate contact in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
